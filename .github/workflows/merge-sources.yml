name: Merge app sources

# 每天自动从上游拉取 DouDuo 与 Erosion-CN 的官方源，重新合并后提交回本仓库。
# 上游发新版后，合并源会在 24 小时内自动跟上，不用手动操作。
on:
  schedule:
    - cron: "0 2 * * *"  # 每天 10:00 北京时间
  workflow_dispatch:  # 也可在 Actions 页手动点 Run workflow 立即跑一次

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge upstream sources
        env:
          SOURCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/apps.json
        run: python3 merge.py apps.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --cached --quiet || git commit -m "自动合并上游源更新"
          git push
